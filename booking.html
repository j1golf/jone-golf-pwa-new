<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060708"><title>Booking | J.ONE GOLF</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell">
<header class="topbar"><a class="brand" href="index.html">J.ONE GOLF</a><button class="menu">☰</button></header>
<main class="section">
<div class="eyebrow">BOOKING</div><h1>간편한 예약 신청</h1><p class="sub">맞춤형 레슨 & 투어</p>
<div class="tabs"><button class="tab active" data-type="lesson">레슨 예약</button><button class="tab" data-type="tour">투어 예약</button></div>
<form id="booking-form">
<input type="hidden" id="booking-type" name="type" value="lesson">
<label>이름<input name="name" required placeholder="이름을 입력하세요"></label>
<label>연락처<input name="phone" required placeholder="전화번호 또는 메신저"></label>
<label>카카오톡 ID (선택)<input name="kakao" placeholder="카카오톡 ID를 입력하세요"></label>
<label>지역 선택<select name="region" required><option value="">선택하세요</option><option>한국</option><option>중국</option><option>태국</option><option>일본</option><option>필리핀</option><option>말레이시아</option><option>인도네시아</option><option>베트남</option></select></label>
<label>희망 날짜<input type="date" name="date"></label>
<label>희망 시간<select name="time"><option>선택하세요</option><option>오전</option><option>오후</option><option>저녁</option></select></label>
<label>요청 사항<textarea name="message" placeholder="요청 사항을 입력하세요"></textarea></label>
<button class="primary" type="submit">예약 신청하기</button><p class="hint">1차 버전은 이 기기에 저장됩니다. 서버 연결 후 관리자 페이지에서 실시간 관리됩니다.</p>
</form>
</main>
<nav class="bottom-nav"><a href="index.html">HOME</a><a href="lesson-tour.html">LESSON & TOUR</a><a class="active" href="booking.html">BOOKING</a><a href="admin.html">ADMIN</a></nav>
<script src="app.js"></script></div></body></html>
